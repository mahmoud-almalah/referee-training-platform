<script type="text/javascript">

$(document).ready(function(){
  $('#share-modal').on('shown.bs.modal', function (e) {
    $('#all-users').select2();
  })
})

$(document).ready(function(){	

	$(document).on('click','#share_list',function(){
		var playlist_id = $(this).attr('rel');
		$('#list_id').val(playlist_id);		
	})
})


$(function(){
  $('.video-labels').click(function() {
    if(!$(this).find(".video-labels-dropdown").hasClass('hidden')){
      $(this).find(".video-labels-dropdown").addClass('hidden');
    }else{
      $(this).find(".video-labels-dropdown").removeClass('hidden');
    }
  })
})  

	$('#exampleModal').on('show.bs.modal', function (event) {
  var button = $(event.relatedTarget) // Button that triggered the modal
  var recipient = button.data('whatever') // Extract info from data-* attributes
  // If necessary, you could initiate an AJAX request here (and then do the updating in a callback).
  // Update the modal's content. We'll use jQuery here, but you could use a data binding library or other methods instead.
  var modal = $(this)
  modal.find('.modal-title').text('Share Playlist')
  modal.find('.modal-body input').val(recipient)
	
})

	$('#share_with').keyup(function(){
		var count = $('#share_with').val().length;
		var user_name = $('#share_with').val();
		if(count > 2){
			$.ajax({
		        url: '{{LINK aj/ap/search_user}}',
		        type : 'POST',
		        data : {user_name:user_name},
		        
		        beforeSend: function() {
		            
		        },
		        success: function(data) {
		        	console.log(data.html);
		            if (data.status == 200) {
		            	$('#user_search_area').html(data.html);
		            }
		        }
		    });
		}else{
			$('#user_search_area').html('');
		}
	})

	$(document).on('click','.user-search-result',function(){
		var $user_name = $(this).text();
		var $user_id = $(this).attr('rel');

		$('#share_with').val($user_name);
		$('#user').val($user_id);
		$('#user_search_area').html('');
	});

	$(document).on('click','#share_video',function(){
		var user_id = $('#all-users').val();
		var list_id = $('#list_id').val();
		$.ajax({
		        url: '{{LINK aj/user/share_playlist}}',
		        type : 'POST',
		        data : {user_id:user_id,list_id:list_id},
		        beforeSend: function() {
		            
		        },
		        success: function(data) {
		        	console.log(data.html);
		            if (data.status == 200) {
		            	if(data.html == 'success'){
		            		swal("Success!", "Playlist shared successfully", "success");
		            		setTimeout(function(){ $('.close_modal').click(); }, 1000);
		            		
		            	}else{
		            		swal("Failed!", "User not found!", "error");
		            	}
		            }
		        }
		    });
	});

</script>
