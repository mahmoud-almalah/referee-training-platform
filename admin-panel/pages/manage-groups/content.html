<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>

$(document).ready(function(){
    $('.select2').select2();
})

$(document).ready(function(){
    $('#add-user-group').on('hidden.bs.modal', function (e) {
        $('#user_group_form')[0].reset();
    })
});

$('select.select2').on('select2:opening', function (e) {
    setTimeout(()=>{
        let top = $('.select2-container--open').eq(1).css('top')
        if(top == '352px'){
            $('.select2-container--open').eq(1).css({'top':'254px'})
        }
    },0)
});


$(function() {
    $(document).on('submit','#user_group_form',function(e){
        e.preventDefault();
        var form_data = $('#user_group_form').serialize();
        $.ajax({
            url: '{{LINK aj/ap/add-user-group}}',
            type : 'POST',
            data : form_data,
            beforeSend: function() {
                //$('#slider_form').find('.waves-effect').text('Please wait..');      
            },
            success: function(data) {
                if (data.status == 200) {
                    $('#name-error').html('');
                    if($('#library-id').val() > 0){
                        $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                User group has been updated successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div> 
                        `);
                    }else{
                        $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                User group has been added successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div> 
                        `);
                    }
                    $('#add-user-group').modal('hide');  
                    setTimeout(()=>{
                        location.reload();
                    },2000)
                }else{
                    $('#alert-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div> 
                    `); 
                    $('#add-user-group').modal('hide');                
                }
            }
        });
    });
});
    

$(document).on('click','.delete_user_group',function(){
    var confirmBox = confirm('Are you sure you want to delete this user group');

    if(confirmBox){

        var user_group_id = $(this).attr('rel');
        var btn = $(this);
        $.ajax({
            url: '{{LINK aj/ap/delete-user-group}}',
            type : 'POST',
            data : {user_group_id:user_group_id},
            
            beforeSend: function() {
                //$('.wait-wave').text('Please wait..');
            },
            success: function(data) {
                if (data.status == 200) {
                    $(btn).closest('tr').remove();
                    $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            User group has been deleted successfully
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div> 
                    `);                    
                }
                $('.wait-wave').text('');
            }
        });
    }
})



$(document).on('click','.edit-user-group',function(){
    var user_group_id = $(this).attr('rel');

    $.ajax({
        url: '{{LINK aj/ap/get-user-group}}',
        type : 'GET',
        data : {user_group_id:user_group_id},
        
        beforeSend: function() {
            //$('.wait-wave').text('Please wait..');
        },
        success: function(data) {
            if (data.status == 200) {
                let {name , user_ids, id } = data.payload;

                $('#user-group-id').val(id);
                $('#user-group-name').val(name);
                let uids = user_ids.split(',')
                $('#users').val(uids).trigger('change');
                $('#add-user-group').modal('show');             
            }
        }
    }); 
})


$(document).on('click','.remove-row',function(){
    let id = $(this).data('id');

    $(`.row-${id}`).remove();
    $(`#hidden-${id}`).remove();

});
</script>
