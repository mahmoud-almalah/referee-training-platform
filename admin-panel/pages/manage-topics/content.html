    <script>

        $(document).ready(function () {


            $('#add-topic').on('hidden.bs.modal', function (e) {
                $('#topic_form')[0].reset();
                $('#finalfilesform2').html('')
                $('#files2').html('')
                $('#finalfilesform').html('')
                $('#files').html('')
            })



            $("#sortable-table").tableDnD({
                onDragStop: function (table, row) {

                    var rows = table.tBodies[0].rows;
                    var sort_order = [];
                    for (var i = 0; i < rows.length; i++) {
                        sort_order.push(rows[i].id);
                    }

                    $.ajax({
                        url: '{{LINK aj/ap/update-topic-sorting}}',
                        type: 'post',
                        data: {
                            sort_order: sort_order,
                            library_id: $('#library_id').val(),
                            channel_id: $('#channel_id').val()
                        },

                        beforeSend: function () {
                            //$('.wait-wave').text('Please wait..');
                        },
                        success: function (data) {
                            if (data.status === 200) {
                                $(table).find("tr").each(function (index) {
                                    if (index > 0) {
                                        $(this).find("th").html(index);
                                    }
                                });
                                $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Sort order has been updated successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                            } else {
                                $('#alert-container').html(`
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                Unable to update sort order. Please refresh page and try again.
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                            }
                        }
                    });
                },
            });
        });

        $(function () {
            $(document).on('submit', '#topic_form', function (e) {
                e.preventDefault();
                var form_data = $('#topic_form').serialize();
                $.ajax({
                    url: '{{LINK aj/ap/add-topic}}',
                    type: 'POST',
                    data: form_data,
                    beforeSend: function () {
                        //$('#slider_form').find('.waves-effect').text('Please wait..');
                    },
                    success: function (data) {
                        if (data.status == 200) {
                            $('#name-error').html('');
                            if ($('#topic-id').val() > 0) {
                                $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Topic has been updated successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div> 
                        `);
                            } else {
                                $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Topic has been added successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div> 
                        `);
                            }
                            $('#add-topic').modal('hide');
                            setTimeout(() => {
                                location.reload();
                            }, 2000)
                        } else {
                            $('#alert-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div> 
                    `);
                            $('#add-topic').modal('hide');
                        }
                    }
                });
            });
        });


        $(document).on('click', '.delete_topic', function () {
            var confirmBox = confirm('Are you sure you want to delete this topic');

            if (confirmBox) {

                var topic_id = $(this).attr('rel');
                var btn = $(this);
                $.ajax({
                    url: '{{LINK aj/ap/delete-topic}}',
                    type: 'POST',
                    data: {topic_id: topic_id},

                    beforeSend: function () {
                        //$('.wait-wave').text('Please wait..');
                    },
                    success: function (data) {
                        if (data.status == 200) {
                            $(btn).closest('tr').remove();
                            $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Topic has been deleted successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div> 
                        `);
                        }
                        $('.wait-wave').text('');
                    }
                });
            }
        })


        $(document).on('click', '.edit-topic', function () {
            var topic_id = $(this).attr('rel');

            $.ajax({
                url: '{{LINK aj/ap/get-topic}}',
                type: 'GET',
                data: {topic_id: topic_id},

                beforeSend: function () {
                    //$('.wait-wave').text('Please wait..');
                },
                success: function (data) {
                    if (data.status === 200) {
                        let {name, sort_order, id, cover} = data.payload;
                        let images = data.images;
                        $('#topic-id').val(id);
                        $('#topic-name').val(name);
                        $('#topic-sort-order').val(sort_order);
                        $('#add-topic').modal('show');

                        $('#finalfilesform2').html(`<input type="hidden" class="dm-images" name="thumb" value="${cover}">`);

                        $('#files2').html(`
                    <li class="media">
                        <div class="media-body mb-1">
                          <p class="mb-2">
                            <strong>thumb.png</strong> - Status: <span class="status text-uploading">Uploaded</span>
                          </p>
                          <div class="progress mb-2">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary bg-" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                            </div>
                        </div>
                    </li>
                `);

                        if (images.length > 0) {

                            images.map(image => {

                                $('#finalfilesform').append(`<input type="hidden" id='hidden-${image.id}' class="dm-images" name="simage[]" value="${image.image}">`);

                                $('#files').append(`
                            <li class="media row-${image.id}">
                                <div class="media-body mb-1">
                                  <p class="mb-2">
                                    <strong>${image.caption}</strong> - Status: <span class="status text-uploading">Uploaded</span>
                                    <button class="btn btn-small btn-sm btn-danger remove-row "  data-id='${image.id}' type="button" >Remove</button> 
                                  </p>
                                  <div class="progress mb-2">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary bg-" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>   
                                    </div>
                                </div>
                            </li>
                        `);
                            })
                        }
                    }
                }
            });
        })

        $(document).on('click', '.remove-row', function () {
            let id = $(this).data('id');

            $(`.row-${id}`).remove();
            $(`#hidden-${id}`).remove();

        });

    </script>

    <script>
        $(document).ready(function () {
            $('.change_status').on('click', function () {
                var topic_id = $(this).attr('rel');
                var status = $(this).hasClass('btn-success') ? 0 : 1;
                $.ajax({
                    type: "POST",
                    url: '{{LINK aj/ap/status-change-topic}}',
                    data: {topic_id: topic_id, status: status},
                    success: function (status) {
                        if (status === '1') {
                            $('#alert-container').html('<div class="alert alert-danger">Something Went Wrong</div>');
                        } else {
                            $('#alert-container').html('<div class="alert alert-success">Topic Status Changed Successfully</div>');
                            setTimeout(function () {
                                location.reload();
                            }, 1000);
                        }
                    }
                });
            });
        });
    </script>
</div>
