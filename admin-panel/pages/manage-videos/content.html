<script>
    $(document).on('click', '.info', function () {
        const video_id = $(this).attr('rel');
        $.ajax({
            type: "GET",
            url: '{{LINK aj/ap/get-video-info}}',
            data: {video_id: video_id},
            success: function (data) {
                if (data.status === 200) {
                    let {title,id,technical,disciplinary,var_technical,var_disciplinary,description,} = data.payload;
                    $('#video-id').val(id);
                    $('#video-name').val(title);
                    $('#technical').val(technical);
                    $('#explanations').val(description);
                    $('#disciplinary').val(disciplinary);
                    $('#var-technical').val(var_technical);
                    $('#var-disciplinary').val(var_disciplinary);
                    if (technical === null || technical === ''){
                        $('#technical-decision').hide();
                    } else {
                        $('#technical-decision').show();
                    }
                    if (disciplinary === null || disciplinary === ''){
                        $('#disciplinary-decision').hide();
                    } else {
                        $('#disciplinary-decision').show();
                    }
                    if (var_technical === null || var_technical === ''){
                        $('#var-technical-decision').hide();
                    } else {
                        $('#var-technical-decision').show();
                    }
                    if (var_disciplinary === null || var_disciplinary === ''){
                        $('#var-disciplinary-decision').hide();
                    } else {
                        $('#var-disciplinary-decision').show();
                    }
                    $('#more-info').modal('show');
                } else {
                    $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                }
            }
        });
    });


    function ChangeStatus(id, status) {
        $.ajax({
            type: "POST",
            url: '{{LINK aj/ap/status-change-video}}',
            data: {video_id: id, status: status},
            success: function (status) {
                if (status === '1') {
                    $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                } else {
                    $('.d-settings-alert').html('<div class="alert alert-success">Video Status Changed Successfully</div>');
                    setTimeout(function () {
                        location.reload();
                    }, 1000);
                }
            }
        });
    }

    function DeleteVideo(id) {
        const r = confirm("Are you sure you want to delete this video?");
        if (r === true) {
            $.ajax({
                type: "POST",
                url: '{{LINK aj/ap/delete-video}}',
                data: {id: id},
                success: function (status) {
                    if (status === '1') {
                        $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                    } else {
                        $('.d-settings-alert').html('<div class="alert alert-success">Video Deleted Successfully</div>');
                        setTimeout(function () {
                            location.reload();
                        }, 1000);
                    }
                }
            });
        }
    }

    $(document).ready(function () {
        $('.library').on('change', function () {
            const id = $(this).val();
            if (id > 0) {
                $.ajax({
                    type: 'GET',
                    url: '{{LINK aj/ap/get-library-channels}}',
                    data: {id : id},
                    success: function (data) {
                        let { channels } = data;
                        $('.channel').html('<option value="0">Select Collection</option>');

                        channels.forEach(channel => {
                            $('.channel').append(`<option value="${channel.id}">${channel.channel_name}</option>`);
                        });
                    }
                });
            } else {
                $('.channel').html('<option value="">Select Library first</option>');
            }
        });
        $('.channel').on('change', function () {
            const id = $(this).val();
            if (id > 0) {
                $.ajax({
                    type: 'GET',
                    url: '{{LINK aj/ap/get-channel-topics}}',
                    data: {id: id},
                    success: function (data) {
                        let {topics} = data;
                        $('.topic').html('<option value="0">Select Topic</option>');

                        topics.forEach(topic => {
                            $('.topic').append(`<option value="${topic.id}">${topic.name}</option>`);
                        });
                    }
                });
            } else {
                $('.topic').html('<option value="">Select Collection first</option>');
            }
        });
    }); //get-library-channels
</script>

<script>


    $(document).ready(function() {
        $('#search-form').submit(function(e) {
            e.preventDefault();
            // Get form data
            const form_data = $(this).serialize();
            // Send AJAX request
            $.ajax({
                url: '{{LINK aj/ap/search-video}}',
                type: 'POST',
                data: form_data,
                success: function(data) {
                    if (data.status !== 'error'){
                        $('.tbody').html(`
                        ${data.videos.map((video) => {
                            let library = data.libraries.find(library => library.id === video.library_id).name;
                            let channel = data.channels.find(channel => channel.id === video.channel_id).channel_name;
                            let topic = data.topics.find(topic => topic.id === video.topic_id).name;
                            let user = data.users.find(user => user.id === video.user_id);
                            return `
                                <tr id="${video.id}">
                                    <td>${video.id}</td>
                                    <td>${video.title}</td>
                                    <td>${library}</td>
                                    <td>${channel}</td>
                                    <td>${topic}</td>
                                    <td>
                                        <img src="{{LINK }}${user.avatar}" id="user-avatar" alt="User Image">
                                        <span class="text-nowrap text-truncate" style="max-width: 200px;">
                                            ${user.username}
                                        </span>
                                    </td>
                                    <td class="text-center">
                                           <span class="btn btn-success change_status" rel="${video.id}" onclick="ChangeStatus('${video.id}', '0')" ` + (video.active === '1' ? '' : 'style="display: none;"') + `><i class="fa fa-check" aria-hidden="true"></i></span>
                                           <span class="btn btn-danger change_status" rel="${video.id}" onclick="ChangeStatus('${video.id}', '1')" ` + (video.active === '0' ? '' : 'style="display: none;"') + `><i class="fa fa-times" aria-hidden="true"></i></span>
                                    </td>
                                    <td class="text-center">
                                        <a href="{{LINK edit-video/}}${video.id}"
                                           class="btn btn-primary btn-sm">Edit</a>
                                        <button class="btn btn-info btn-sm info" rel="${video.id}">
                                            Info
                                        </button>
                                        <a href="javascript:void(0)" class="btn btn-danger btn-sm"
                                           onclick="DeleteVideo('${video.id}')">Delete</a>
                                        <a href="{{LINK watch/}}${video.title}_${video.video_id}&topic_id=${video.topic_id}.html/"
                                           class="btn btn-success btn-sm" target="_blank">View</a>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    `);
                    } else {
                        $('.tbody').html(`
                            <tr>
                                <td colspan="8" class="text-center">No data found</td>
                            </tr>
                        `);
                    }
                },
            });
        });
    });
    $('#reset-btn').click(function () {
        $('#search-form')[0].reset();
        $('#search-form').submit();
    });
</script>
