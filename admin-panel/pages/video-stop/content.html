<script>
    $(document).on('click', '.info', function () {
        var video_id = $(this).attr('rel');
        $.ajax({
            type: "GET",
            url: '{{LINK aj/ap/get-video-info}}',
            data: {video_id: video_id},
            success: function (data) {
                if (data.status === 200) {
                    let {title,id,free_kick_decision,technical,disciplinary,description,yellow_card_decision} = data.payload;
                    $('#video-id').val(id);
                    $('#video-name').val(title);
                    $('#technical').val(technical);
                    $('#explanations').val(description);
                    $('#disciplinary').val(disciplinary);
                    $('#var-technical').val(yellow_card_decision);
                    $('#var-disciplinary').val(free_kick_decision);
                    $('#more-info').modal('show');
                } else {
                    $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                }

            }
        });
    });
    $(document).ready(function () {
        $('.change_status').on('click', function () {
            var video_id = $(this).attr('rel');
            var status = $(this).hasClass('btn-success') ? 0 : 1;
            $.ajax({
                type: "POST",
                url: '{{LINK aj/ap/status-change-video}}',
                data: {video_id: video_id, status: status},
                success: function (status) {
                    if (status === '1') {
                        $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                    } else {
                        $('.d-settings-alert').html('<div class="alert alert-success">Menu Status Changed Successfully</div>');
                        setTimeout(function () {
                            location.reload();
                        }, 1000);
                    }
                }
            });
        });
    });

    function DeleteVideo(id) {
        var r = confirm("Are you sure you want to delete this video?");
        if (r === true) {
            $.ajax({
                type: "POST",
                url: '{{LINK aj/ap/delete-video}}',
                data: {id: id},
                success: function (status) {
                    if (status === '1') {
                        $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                    } else {
                        $('.d-settings-alert').html('<div class="alert alert-success">Video Deleted Successfully</div>');
                        setTimeout(function () {
                            location.reload();
                        }, 1000);
                    }
                }
            });
        }
    }
</script>
