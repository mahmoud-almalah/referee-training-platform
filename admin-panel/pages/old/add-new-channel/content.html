<script>
	/*

$(document).ready(function(){
	$('#channel-category').select2({placeholder : "Select Categories"});
    $('#channel-user').select2({placeholder : "Select Users"});
})

$(document).ready(function () {
	//Contact Form validation on click event
	
	var form_add_settings = $('form.add-settings');

	$("#channel-form").on("submit", function (e) {

		e.preventDefault();

		let thumb_image = $("#thumb_image").val();
		let channel_name = $("#channel-name").val();
		let description = $("#channel-description").val();
		let user_id = '{{ME id}}';
        let categories = $('#channel-category').val();
		let users = $('#channel-user').val();

		let data = { 
			user_id: user_id, 
			channel_name: channel_name, 
			description: description,
			thumb_image:thumb_image, 
			categories : categories,
            users:users
		}

		console.log(data);

		$.post('{{LINK aj/ap/add_new_channel}}', data)
			.done(function (data) {
	            if (data.status == 200) {
	                $("html, body").animate({ scrollTop: 0 }, "slow");
	                $('.add-settings-alert').html('<div class="alert alert-success"><i class="fa fa-check"></i> Channel added successfully</div>');
	                setTimeout(function () {
	                    window.location.href = '<?php echo PT_LoadAdminLinkSettings('manage-channels'); ?>';
	                }, 1000);
	            } else if (data.status == 400) {
	                $('.add-settings-alert').html('<div class="alert alert-danger">'+data.message+'</div>');
	                setTimeout(function () {
	                    $('.add-settings-alert').html('');
	                }, 1000);
	            }
	            form_add_settings.find('.waves-effect').text('Create');
			})
			.fail(function (err) {
				console.log("error", err);
			});
	});
});


</script>
