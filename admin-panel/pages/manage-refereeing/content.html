<script>
    function ChangeStatus(id, status) {
        $.ajax({
            type: "POST",
            url: '{{LINK aj/ap/status-change-refereeing}}',
            data: {id: id, status: status},
            success: function (status) {
                if (status === 500) {
                    $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                } else {
                    $('.d-settings-alert').html('<div class="alert alert-success">Status Changed Successfully</div>');
                    setTimeout(function () {
                        location.reload();
                    }, 1000);
                }
            }
        });
    }

    $.ajax({
        type: "GET",
        url: 'https://restcountries.com/v3.1/all',
        success: function (data) {
            $.each(data, function (key, value) {
                $('#referee-country').append('<option value="' + value.name.common + '">' + value.name.common + '</option>');
            });
        }
    });
    $.ajax({
        type: "GET",
        url: 'https://restcountries.com/v3.1/all',
        success: function (data) {
            $.each(data, function (key, value) {
                $('#country').append('<option value="' + value.name.common + '">' + value.name.common + '</option>');
            });
        }
    });


    $(document).ready(function () {
        $('#referee-country').select2();
    });

    $(function () {
        $(document).on('submit', '#referee_form', function (e) {
            e.preventDefault();
            const form_data = $('#referee_form').serialize();
            $.ajax({
                url: '{{LINK aj/ap/add-referee}}',
                type: 'POST',
                data: form_data,
                success: function (data) {
                    if (data.status === 200) {
                        if ($('#referee_id').val() > 0) {
                            $('.d-settings-alert').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Referee has been updated successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                        } else {
                            $('.d-settings-alert').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Referee has been added successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                        }
                        $('#add-referee').modal('hide');
                        setTimeout(() => {
                            location.reload();
                        }, 2000)
                    } else {
                        $('.d-settings-alert').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                        $('#add-referee').modal('hide');
                    }
                }
            });
        });
    });

    function EditReferee(id) {
        $.ajax({
            url: '{{LINK aj/ap/get-referee}}',
            type: 'POST',
            data: {id: id},
            success: function (data) {
                if (data.status === 200) {
                    let referee = data.payload;
                    $('#referee_id').val(referee.id);
                    $('#referee-first').val(referee.first_name);
                    $('#referee-last').val(referee.last_name);
                    $('#referee-country').val(referee.country);
                    $('#referee-role').val(referee.role);
                    $('#referee-status').val(referee.status);
                    $('#add-referee').modal('show');
                    $('#referee-country').select2(
                        {
                            placeholder: referee.country
                        }
                    );
                } else {
                    $('.d-settings-alert').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true" id="alert-close">&times;</span>
                            </button>
                        </div>
                    `);
                }
            }
        });
    }

    function DeleteReferee(id) {
        const confirm = window.confirm('Are you sure you want to delete this referee?');
        if (!confirm) {
            return false;
        } else {
            $.ajax({
                url: '{{LINK aj/ap/delete-referee}}',
                type: 'POST',
                data: {id: id},
                success: function (data) {
                    if (data.status === 200) {
                        $('.d-settings-alert').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            Referee has been deleted successfully
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true" id="alert-close">&times;</span>
                            </button>
                        </div>
                    `);
                        setTimeout(() => {
                            location.reload();
                        }, 2000)
                    } else {
                        $('.d-settings-alert').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true" id="alert-close">&times;</span>
                            </button>
                        </div>
                    `);
                    }
                }
            });
        }
    }
</script>

                                    <span class="btn btn-success change_status" rel="` + referee.id + `"

                                        <i class="fa fa-check" aria-hidden="true"></i></span>
                                    <span class="btn btn-danger change_status" rel="` + referee.id + `"

                                        <i class="fa fa-times" aria-hidden="true"></i></span>
                                    </td>
                                   <td>
                                    <a class="btn bg-success admn_table_btn edit-referee "
                                       onclick="EditReferee('${referee.id}')">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                             viewBox="0 0 24 24">
                                            <path fill="currentColor"
                                                  d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"></path>
                                        </svg>
                                        Edit</a>

                                    <button class="btn bg-danger admn_table_btn delete-referee"

                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                             viewBox="0 0 24 24">
                                            <path fill="currentColor"
                                                  d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"></path>
                                        </svg>
                                        Delete
                                    </button>
                                </td>
                                </tr>
                            `;
                        }).join('')}
                    `);
                    } else {
                        $('.tbody').html(`
                            <tr>
                                <td colspan="8" class="text-center">No data found</td>
                            </tr>
                        `);
                    }
                },
            });
        });
    });

</script>
