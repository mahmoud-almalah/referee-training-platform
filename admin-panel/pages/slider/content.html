<script>

    $(document).ready(function () {
        $('#add-slide').on('hidden.bs.modal', function (e) {

    $(function () {
        $(document).on('submit', '#slider_form', function (e) {
            e.preventDefault();
            var form_data = $('#slider_form').serialize();
            $.ajax({
                url: '{{LINK aj/ap/add-slider}}',
                type: 'POST',
                data: form_data,
                beforeSend: function () {
                    //$('#slider_form').find('.waves-effect').text('Please wait..');
                },
                success: function (data) {
                    if (data.status === 200) {
                        $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            Slide has been added successfully
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                        $('#add-slide').modal('hide');
                        setTimeout(() => {
                            location.reload();
                        }, 2000)
                    } else {
                        $('#alert-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                        $('#add-slide').modal('hide');
                    }
                }
            });
        });
    });

<script>
    $(document).ready(function () {
        $('.change_status').click(function () {
            var background_id = $(this).attr('rel');
            var status = $(this).hasClass('btn-success') ? 0 : 1;
            $.ajax({
                url: '{{LINK aj/ap/change-background-status}}',
                type: "POST",
                data: {background_id: background_id , status: status},
                success: function (data) {
                    if (data === 1) {
                        $('#alert-container').html('<div class="alert alert-danger alert-dismissible fade show" role="alert">\n' +
                            '  <strong>Error!</strong> Background Status Not Changed.\n' +
                            '  <button type="button" class="close" data-dismiss="alert" aria-label="Close">\n' +
                            '    <span aria-hidden="true">&times;</span>\n' +
                            '  </button>\n' +
                            '</div>');
                    } else {
                        $('#alert-container').html('<div class="alert alert-success alert-dismissible fade show" role="alert">\n' +
                            '  <strong>Success!</strong> Background Status Changed.\n' +
                            '  <button type="button" class="close" data-dismiss="alert" aria-label="Close">\n' +
                            '    <span aria-hidden="true">&times;</span>\n' +
                            '  </button>\n' +
                            '</div>');
                        setTimeout(function () {
                            location.reload();
                        }, 1000);
                    }
                }
            });
        });
    });

        $('.change_status_sr').click(function () {

<script>

        $("#background_list").sortable({
            placeholder : 'background_list',
            update : function(event, ui)
            {
                var back_id = [];
                $('#background_list tr').each(function(){
                    back_id.push($(this).attr("data-post-id"));
