<script type="text/javascript" src="https://cdn.ckeditor.com/4.10.1/standard/ckeditor.js"></script>
<script type="text/javascript">

$(document).ready(function(){
    CKEDITOR.replace( $('#editor').attr('id') );
});

$(function() {
    $(document).on('submit','#email_form',function(e){
        e.preventDefault();

        $.ajax({
            url: '{{LINK aj/ap/update-template}}',
            type : 'POST',
            data : {template : CKEDITOR.instances[$('#editor').attr('id')].getData() },
            beforeSend: function() {
                //$('#slider_form').find('.waves-effect').text('Please wait..');      
            },
            success: function(data) {
                if (data.status == 200) {
                    $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            Email template has been saved successfully
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div> 
                    `);
                    setTimeout(()=>{
                        location.reload();
                    },2000)
                }else{
                    $('#alert-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div> 
                    `); 
                    $('#add-user-group').modal('hide');                
                }
            }
        });
    });
});
</script>
