<script>
    $(function () {
        $(document).on('submit', '#decision_info_form', function (e) {
            e.preventDefault();
            var form_data = $('#decision_info_form').serialize();
            $.ajax({
                url: '{{LINK aj/ap/add-decision-info}}',
                type: 'POST',
                data: form_data,
                success: function (data) {
                    if (data.status === 200) {
                        $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                <strong>Decision Information has been Add successfully!</strong>
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                    } else {
                        $('#alert-container').html(`
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                <strong>Decision Information has not been Add!</strong>
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                    }
                    $('#decision-information').modal('hide');
                    $('#decision_info_form')[0].reset();
                    setTimeout(function () {
                        location.reload();
                    }, 2000);
                }
            });
        });
    });
    $(function () {
        $(document).on('change', '#decisionType', function () {
            var id = $(this).val();
            $.ajax({
                url: '{{LINK aj/ap/get-decision-type}}',
                type: 'GET',
                data: {id: id},
                success: function (data) {
                    if (data.status === 200) {
                        let {id, technical, disciplinary, var_technical, var_disciplinary} = data.data;
                        $('#decision-id').val(id);
                        $('#info-table').html(`
                                <tr class="table-info text-center">
                                    <td colspan="1">${technical}</td>
                                    <td colspan="1">${disciplinary}</td>
                                    <td colspan="1">${var_technical}</td>
                                    <td colspan="1">${var_disciplinary}</td>
                                    <td colspan="1" class="text-right">#</td>
                                   #</td>
                                </tr>
                        `);

                        if (data.types.length > 0) {
                            data.types.map(type => {
                                    $('#info-table').append(`
                                        <tr>
                                            <td><input type="text" id="technical" name="technical[]" class="form-control" value="${type.technical}" ` + (technical === '' ? 'hidden' : '') + `></td>
                                            <td><input type="text" id="disciplinary" name="disciplinary[]" class="form-control" value="${type.disciplinary}" ` + (disciplinary === '' ? 'hidden' : '') + `></td>
                                            <td><input type="text" id="var_technical" name="var_technical[]" class="form-control" value="${type.var_technical}" ` + (var_technical === '' ? 'hidden' : '') + `></td>
                                            <td><input type="text" id="var_disciplinary" name="var_disciplinary[]" class="form-control" value="${type.var_disciplinary}" ` + (var_disciplinary === '' ? 'hidden' : '') + `></td>
                                            <td>
                                                <button type="button" class="btn btn-sm bg-danger delete-row">Remove</button>
                                            </td>
                                        </tr>
                                    `);
                                }
                            );
                        } else {
                            $('#info-table').append(`
                                <tr>
                                    <td><input type="text" name="technical[]" class="form-control"` + (technical === '' ? 'hidden' : '') + `></td>
                                    <td><input type="text" name="disciplinary[]" class="form-control" ` + (disciplinary === '' ? 'hidden' : '') + `></td>
                                    <td><input type="text" name="var_technical[]" class="form-control" ` + (var_technical === '' ? 'hidden' : '') + `></td>
                                    <td><input type="text" name="var_disciplinary[]" class="form-control" ` + (var_disciplinary === '' ? 'hidden' : '') + `></td>
                                    <td>
                                        <button type="button" class="btn btn-sm bg-danger delete-row">Remove</button>
                                    </td>
                                </tr>
                            `);
                        }
                        $('#info-table-footer').html(`
                                    <tr class="table-info text-center text-white">
                                        <td class="text-center" colspan="5">
                                            <button type="button" class="btn btn-sm bg-success add-row">Add Row</button>
                                        </td>
                                    </tr>
                        `);
                    } else {
                        $('#info-table').html('');
                        $('#info-table-footer').html('');
                    }
                }
            });
        });

    });

    $(function () {
        $(document).on('click', '.add-row', function () {
            var id = $('#decisionType').val();
            $.ajax({
                url: '{{LINK aj/ap/get-decision-type}}',
                type: 'GET',
                data: {id: id},
                success: function (data) {
                    if (data.status === 200) {
                        let {technical, disciplinary, var_technical, var_disciplinary} = data.data;
                        $('#info-table').append(`
                            <tr>
                                <td><input type="text" name="technical[]" class="form-control" ` + (technical === '' ? 'hidden' : '') + `></td>
                                <td><input type="text" name="disciplinary[]" class="form-control" ` + (disciplinary === '' ? 'hidden' : '') + `></td>
                                <td><input type="text" name="var_technical[]" class="form-control" ` + (var_technical === '' ? 'hidden' : '') + `></td>
                                <td><input type="text" name="var_disciplinary[]" class="form-control" ` + (var_disciplinary === '' ? 'hidden' : '') + `></td>
                                <td>
                                    <button type="button" class="btn btn-sm bg-danger delete-row">Remove</button>
                                </td>
                            </tr>
                        `);
                    }
                }
            });
        })
    })


    $(function () {
        $(document).on('click', '.delete-row', function () {
            $(this).parent().parent().remove();
        })
    })
    $(document).on('submit', '#decision_type_form', function (e) {
        e.preventDefault();
        var form_data = $('#decision_type_form').serialize();
        $.ajax({
            url: '{{LINK aj/ap/add-decision-type}}',
            type: 'POST',
            data: form_data,
            success: function (data) {
                if (data.status === 200) {
                    $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <strong>Decision Types has been Add successfully!</strong>
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                } else {
                    $('#alert-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <strong>Decision Types has not been Add!</strong>
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                }
                $('#add-decision-type').modal('hide');
                $('#decision_type_form')[0].reset();
                setTimeout(function () {
                    location.reload();
                }, 2000);
            }
        });
    });
    $(document).on('click', '#delete-decision-type', function () {
        var confirmBox = confirm('Are you sure you want to delete this decision type');
        if (confirmBox) {
            var id = $(this).attr('rel');
            var btn = $(this);
            $.ajax({
                url: '{{LINK aj/ap/delete-decision-type}}',
                type: 'POST',
                data: {id: id},
                success: function (data) {
                    if (data.status === 200) {
                        $(btn).closest('tr').remove();
                        $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            Decision Type has been deleted successfully
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                        setTimeout(() => {
                            location.reload();
                        }, 2000)
                    }
                }
            });
        }
    })
    $(document).on('click', '#delete-decision', function () {
        var confirmBox = confirm('Are you sure you want to delete this row');
        if (confirmBox) {
            var id = $(this).attr('rel');
            var btn = $(this);
            $.ajax({
                url: '{{LINK aj/ap/delete-decision-info}}',
                type: 'POST',
                data: {id: id},
                success: function (data) {
                    if (data.status === 200) {
                        $(btn).closest('tr').remove();
                        $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            Row has been deleted successfully
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                        setTimeout(() => {
                            location.reload();
                        }, 2000)
                    }
                }
            });
        }
    })
</script>
