<script>

$(function() {
    var form_add_settings = $('form.add-settings');
    form_add_settings.ajaxForm({
        url: '{{LINK aj/ap/update_decision}}',
        beforeSend: function() {
            form_add_settings.find('.waves-effect').text('Please wait..');
        },
        success: function(data) {
            if (data.status == 200) {
                $("html, body").animate({ scrollTop: 0 }, "slow");
                $('.add-settings-alert').html('<div class="alert alert-success"><i class="fa fa-check"></i> Decision updated successfully</div>');
                setTimeout(function () {
                    window.location.href = '<?php echo PT_LoadAdminLinkSettings('manage-decisions'); ?>';
                }, 1000);
            } else if (data.status == 400) {
                $('.add-settings-alert').html('<div class="alert alert-danger">'+data.message+'</div>');
                setTimeout(function () {
                    $('.add-settings-alert').html('');
                }, 1000);
            }
            form_add_settings.find('.waves-effect').text('Update');
        }
    });
});
</script>
