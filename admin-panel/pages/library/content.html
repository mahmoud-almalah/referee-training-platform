    <script>

        $(document).ready(function () {
            $('#add-library').on('hidden.bs.modal', function (e) {
                $('#library_form')[0].reset();
                $('#finalfilesform2').html('')
                $('#files2').html('')
                $('#finalfilesform').html('')
                $('#files').html('')
                $('#finalfilesform3').html('')
                $('#files3').html('')
            });

            $('#add-library').on('shown.bs.modal', function (e) {
                $('#all-users').select2(
                    {
                        placeholder: "Select users",
                        allowClear: true,
                        width: '100%',
                    }
                );
            });

            $(document).ready(function () {
                $("#sortable-table").sortable({
                    placeholder : 'sortable-table',
                    update : function(event, ui)
                    {
                        var library_id = [];
                        $('#sortable-table tr').each(function(){
                            library_id.push($(this).attr("id"));
                        });
                        $.ajax({
                            url:"{{LINK aj/ap/update-library-order}}",
                            method:"POST",
                            data:{library_id:library_id},
                        })
                        $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Library has been updated successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                        setTimeout(function () {
                            location.reload();
                        }, 1000);
                    }
                });
            });
        });
        $(document).ready(function () {
            $(document).on('change', '#all-groups', function () {

                let ids = $(this).find(':selected').data('ids')
                if (ids !== undefined) {
                    let users = ids.split(',');
                    $('#all-users').val(users).trigger('change');
                }
            })
        });
        $(function () {
            $(document).on('submit', '#library_form', function (e) {
                e.preventDefault();
                const form_data = $('#library_form').serialize();
                $.ajax({
                    url: '{{LINK aj/ap/add-library}}',
                    type: 'POST',
                    data: form_data,
                    beforeSend: function () {
                        //$('#slider_form').find('.waves-effect').text('Please wait..');
                    },
                    success: function (data) {
                        if (data.status === 200) {
                            $('#name-error').html('');
                            if ($('#library-id').val() > 0) {
                                $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Library has been updated successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                            } else {
                                $('#alert-container').html(`
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Library has been added successfully
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        `);
                            }
                            $('#add-library').modal('hide');
                            setTimeout(() => {
                                location.reload();
                            }, 2000)
                        } else {
                            $('#alert-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${data.message}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                            $('#add-library').modal('hide');
                        }
                    }
                });
            });
        });
        $(document).on('click', '.edit-library', function () {
            var library_id = $(this).attr('rel');

            $.ajax({
                url: '{{LINK aj/ap/get-library}}',
                type: 'GET',
                data: {library_id: library_id},
                success: function (data) {
                    if (data.status === 200) {
                        let {name, sort_order, id, path, back_img} = data.payload;
                        let images = data.images;
                        let users = data.users;

                        $('#library-id').val(id);
                        $('#library-name').val(name);
                        $('#library-sort-order').val(sort_order);
                        $('#all-users').val(users).trigger('change');
                        $('#path').val(path);
                        $('#back_img').val(back_img);
                        $('#add-library').modal('show');

                        $('#finalfilesform2').append(`<input type="hidden" class="dm-images" name="path" value="${path}">`);
                        $('#finalfilesform3').append(`<input type="hidden" class="dm-images" name="back_img" value="${back_img}">`);

                        $('#files2').append(`
                            <li class="media">
                                <div class="media-body mb-1">
                                  <p class="mb-2">
                                    <strong>${path}</strong> - Status: <span class="status text-uploading">Uploaded</span>
                                  </p>
                                  <div class="progress mb-2">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary bg-" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                                    </div>
                                </div>
                            </li>
                        `);
                        $('#files3').append(`
                            <li class="media">
                                <div class="media-body mb-1">
                                  <p class="mb-2">
                                    <strong>${back_img}</strong> - Status: <span class="status text-uploading">Uploaded</span>
                                  </p>
                                  <div class="progress mb-2">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary bg-" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                                    </div>
                                </div>
                            </li>
                        `);


                        if (images.length > 0) {

                            images.map(image => {

                                $('#finalfilesform').append(`<input type="hidden" id='hidden-${image.id}' class="dm-images" name="simage[]" value="${image.image}">`);

                                $('#files').append(`
                            <li class="media row-${image.id}">
                                <div class="media-body mb-1">
                                  <p class="mb-2">
                                    <strong>${image.caption}</strong> - Status: <span class="status text-uploading">Uploaded</span>
                                    <button class="btn btn-small btn-sm btn-danger remove-row "  data-id='${image.id}' type="button" >Remove</button>
                                  </p>
                                  <div class="progress mb-2">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary bg-" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                                    </div>
                                </div>
                            </li>
                        `);
                            })
                        }
                    }
                }
            });
        });


        $(document).on('click', '.remove-row', function () {
            let id = $(this).data('id');

            $(`.row-${id}`).remove();
            $(`#hidden-${id}`).remove();

        });

        $(document).on('click', '.delete_library', function () {
            const confirmBox = confirm('Are you sure you want to delete this library');

            if (confirmBox) {

                const library_id = $(this).attr('rel');
                const btn = $(this);
                $.ajax({
                    url: '{{LINK aj/ap/delete-library}}',
                    type: 'POST',
                    data: {library_id: library_id},

                    beforeSend: function () {
                        //$('.wait-wave').text('Please wait..');
                    },
                    success: function (data) {
                        if (data.status === 200) {
                            $(btn).closest('tr').remove();
                            $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            Library has been deleted successfully
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                        }
                        $('.wait-wave').text('');
                    }
                });
            }
        });

    </script>

    <script>
        $(document).ready(function () {
            $('.change_status').on('click', function () {
                var library_id = $(this).attr('rel');
                var status = $(this).hasClass('btn-success') ? 0 : 1;
                $.ajax({
                    type: "POST",
                    url: '{{LINK aj/ap/status-change-library}}',
                    data: {library_id: library_id, status: status},
                    success: function (status) {
                        if (status === '1') {
                            $('.d-settings-alert').html('<div class="alert alert-danger">Something Went Wrong</div>');
                        } else {
                            $('.d-settings-alert').html('<div class="alert alert-success">Menu Status Changed Successfully</div>');
                            setTimeout(function () {
                                location.reload();
                            }, 1000);
                        }
                    }
                });
            });
        });
    </script>
